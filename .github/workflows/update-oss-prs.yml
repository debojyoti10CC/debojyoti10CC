name: Update Open Source Contributions

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild contributions table
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: debojyoti10CC
          LANDED_PRS: "Graphify-Labs/graphify#5299=cherry-picked into v0.9.118,wevm/incur#296=merged via #319"
        run: python .github/scripts/update_oss_prs.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update open source contributions" || echo "No changes to commit"
          git pull --rebase
          git push
